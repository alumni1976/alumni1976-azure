<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Alumni 1976 · Σχολή Ηλεκτρολόγων Μηχανικών · Πανεπιστήμιο Πατρών</title>

  <meta
    name="description"
    content="Ψηφιακός χώρος των αποφοίτων 1976 της Σχολής Ηλεκτρολόγων Μηχανικών του Πανεπιστημίου Πατρών."
  />
  <meta property="og:title" content="Alumni 1976 · Πανεπιστήμιο Πατρών" />
  <meta
    property="og:description"
    content="Σκέψεις, αναμνήσεις, φωτογραφίες και εκδηλώσεις των αποφοίτων Ηλεκτρολόγων Μηχανικών του 1976."
  />
  <meta property="og:image" content="https://alumni1976.gr/assets/logo/concard50years.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Preconnect for faster external resource loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Crimson+Pro:wght@300;400;500;600&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'"
  />

  <link rel="stylesheet" href="./css/styles.css?v=1.0.12">
</head>

<body>

  <nav class="site-nav" role="navigation" aria-label="Κύρια Πλοήγηση">
    <a href="#/home" class="logo site-brand" data-route="home" aria-label="Alumni 1976 Αρχική">
      <img
        src="./assets/logo/concard50years.png"
        alt="Alumni 1976 Logo"
        width="50"
        height="50"
        loading="lazy"
      />
      <span class="logo-text site-brand-text">Alumni <span>1976</span></span>
    </a>
    <a href="#/reunion" class="reunion-link">50th Reunion</a>

    <div class="nav-menu-area">
      <ul id="menu" class="site-menu" role="menubar"></ul>

      <div class="theme-control" aria-label="Επιλογή εμφάνισης ιστοσελίδας">
        <label for="themeSelector">Στυλ</label>
        <select id="themeSelector" aria-label="Επιλογή θέματος">
          <option value="style-deep-navy-university">Deep Navy University</option>
          <option value="style-academic-gold">Academic Gold</option>
          <option value="style-engineering-tech">Engineering Tech</option>
          <option value="style-executive-alumni">Executive Alumni</option>
          <option value="style-polytechnic-heritage">Polytechnic Heritage</option>
          <option value="style-modern-minimal">Modern Minimal</option>
        </select>
      </div>

      <button id="authToggleBtn" type="button" class="auth-toggle-btn" aria-haspopup="true">
        <span id="authToggleLabel">Σύνδεση</span>
      </button>
    </div>
  </nav>

  <div class="auth-flyout hidden" id="authFlyout">
    <div id="authFlyoutLoggedOut">
      <p class="auth-flyout-note">
        Η περιήγηση είναι ελεύθερη σε όλους. Συνδεθείτε για να αναρτήσετε, να σχολιάσετε ή να επεξεργαστείτε τα στοιχεία σας.
      </p>

      <label class="auth-field-label">
        Email
        <input type="email" id="authEmail" class="thinktank-input" autocomplete="email">
      </label>

      <label class="auth-field-label">
        Κωδικός
        <div class="password-field-wrap" style="position:relative;">
          <input type="password" id="authPassword" class="thinktank-input" autocomplete="current-password" style="padding-right:40px;">
          <button type="button" id="toggleAuthPasswordBtn" aria-label="Εμφάνιση κωδικού" style="position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:1.1rem; line-height:1;">👁</button>
        </div>
      </label>

      <button id="authLoginBtn" class="btn-primary thinktank-button">Σύνδεση</button>

      <p id="authMessage" class="thinktank-message"></p>
    </div>
<div id="authFlyoutLoggedIn" class="hidden">
  <p id="authWelcomeText" class="auth-flyout-note"></p>
  <a href="#/profile" id="authProfileLink" class="btn-outline" style="display:block; text-align:center; margin-bottom:8px;">Τα στοιχεία μου</a>
  <button id="authLogoutBtn" class="btn-outline">Αποσύνδεση</button>
</div>
    
  </div>

  <main id="app" aria-live="polite">
    <div class="loading" role="status" aria-label="Φόρτωση περιεχομένου">
      <span class="loading-spinner"></span>
      <span>Φόρτωση...</span>
    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="footer-inner footer-three-column">
      <div class="footer-brand">
        <a href="#/home" class="footer-logo-link" data-route="home" aria-label="Alumni 1976 Home">
          <img
            src="./assets/logo/concard50years.png"
            alt="Alumni 1976 Logo"
            width="75"
            height="75"
            loading="lazy"
            decoding="async"
          />
        </a>

        <div class="footer-logo">Alumni <span>1976</span></div>
      </div>

      <div class="footer-school">
        Σχολή Ηλεκτρολόγων Μηχανικών · Πανεπιστήμιο Πατρών
      </div>

      <div class="footer-copyright">
        © 2026 Σύλλογος Αποφοίτων 1976
      </div>
    </div>
  </footer>

  <!-- Module scripts - loaded with type="module" -->
  <script type="module" src="./js/app.js?v=1.0.7"></script>
  <script type="module" src="./js/theme-selector.js?v=1.0.2"></script>

</body>
</html>
